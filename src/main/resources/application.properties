spring.application.name=ecom_backend

# Oracle datasource configuration
# Update the URL, username, and password to match your Oracle instance.
# Common local Oracle XE URLs:
#   Oracle 21c XE: jdbc:oracle:thin:@//localhost:1521/XEPDB1
#   Oracle 11g/18c XE: jdbc:oracle:thin:@//localhost:1521/XE
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=ecom
spring.datasource.password=123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# HikariCP connection pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate configuration
# ddl-auto=validate means Hibernate only checks that entities match the schema.
# Schema changes are managed by Flyway migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway configuration
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT configuration
# Change this secret in production. It must be at least 256 bits (32 bytes) for HS256.
jwt.secret=my-very-secret-key-that-should-be-replaced-in-production!!!
jwt.access-token-expiration=86400000
jwt.refresh-token-expiration=604800000

# DevTools configuration
# Disable automatic restart to avoid Lombok class-loading issues with RestartClassLoader.
spring.devtools.restart.enabled=false
