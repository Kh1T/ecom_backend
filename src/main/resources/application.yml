spring:
  application:
    name: ecom_backend

  # Oracle datasource configuration
  # Update the URL, username, and password to match your Oracle instance.
  # Common local Oracle XE URLs:
  #   Oracle 21c XE: jdbc:oracle:thin:@//localhost:1521/XEPDB1
  #   Oracle 11g/18c XE: jdbc:oracle:thin:@//localhost:1521/XE
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
    username: ecom
    password: "123"
    driver-class-name: oracle.jdbc.OracleDriver

    # HikariCP connection pool settings
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA / Hibernate configuration
  # ddl-auto=validate means Hibernate only checks that entities match the schema.
  # Schema changes are managed by Flyway migrations.
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
    show-sql: true

  # Flyway configuration
  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration

  # DevTools configuration
  # Disable automatic restart to avoid Lombok class-loading issues with RestartClassLoader.
  devtools:
    restart:
      enabled: false

# JWT configuration
# Change this secret in production. It must be at least 256 bits (32 bytes) for HS256.
jwt:
  secret: my-very-secret-key-that-should-be-replaced-in-production!!!
  access-token-expiration: 86400000
  refresh-token-expiration: 604800000
