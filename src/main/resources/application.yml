spring:
  application:
    name: ecom_backend

  datasource:
    url: jdbc:postgresql://localhost:5432/ecom_db
    username: postgres
    password: 
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect