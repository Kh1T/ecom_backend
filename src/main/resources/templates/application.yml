spring:
  application:
    name: ecom_backend

  config:
    import: optional:file:.env[.properties]

  # Supabase (PostgreSQL) datasource configuration
  # Replace the URL, username, and password with your Supabase project credentials.
  # Find the JDBC connection string under Project Settings -> Database -> Connection string -> JDBC.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}

    # HikariCP connection pool settings
    # Supabase free tier has a low connection limit, so keep the pool small.
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA / Hibernate configuration
  # ddl-auto=validate means Hibernate only checks that entities match the schema.
  # Schema changes are managed by Flyway migrations.
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  # Flyway configuration
  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration

  # DevTools configuration
  # Disable automatic restart to avoid Lombok class-loading issues with RestartClassLoader.
  devtools:
    restart:
      enabled: false

# JWT configuration
# Change this secret in production. It must be at least 256 bits (32 bytes) for HS256.
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:86400000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}